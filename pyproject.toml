[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "glaurlex"
version = "0.1.0"
description = "Lexical availability statistics, co-occurrence graphs and group inference."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Marcos Gómez Robres", email = "magomerob@unirioja.es" }]
keywords = ["lexical availability", "disponibilidad léxica", "linguistics", "network analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scipy>=1.11,<2",
    "networkx>=3.2,<4",
    "igraph>=0.11,<2",
    "leidenalg>=0.10,<0.12",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.14,<0.15", "mypy>=1.10", "build", "twine"]

[tool.hatch.build.targets.wheel]
packages = ["src/glaurlex"]

[tool.hatch.build.targets.sdist]
include = ["src/glaurlex", "tests", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RET", "PT", "PIE", "PERF", "RUF", "T20", "TC", "D"]
ignore = ["D105", "D107"]
allowed-confusables = ["α", "ρ", "×", "−", "∪", "–", "σ", "ω"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"src/glaurlex/core/graph.py" = ["N806"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src/glaurlex"]

[[tool.mypy.overrides]]
module = ["networkx.*", "igraph.*", "leidenalg.*", "scipy.*", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::FutureWarning"]

[tool.coverage.run]
source = ["glaurlex"]

[tool.coverage.report]
fail_under = 85
show_missing = true
